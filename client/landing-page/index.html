<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smell Coffee — Landing</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: #FAFAF5;
      color: #1A1A1A;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .landing {
      scroll-snap-type: y mandatory;
      overflow-y: scroll;
      height: 100vh;
    }

    .screen {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 100vh;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #FAFAF5;
    }

    .screen__frame {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: translateY(36px);
      transition:
        opacity 1s ease-in-out,
        transform 1s ease-in-out;
      will-change: opacity, transform;
    }

    .screen__frame.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .screen__image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      user-select: none;
      pointer-events: none;
    }

    @media (max-width: 768px) {
      .screen__image {
        object-fit: contain;
      }
    }

    .screen__overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(250, 250, 245, 0) 70%,
        rgba(250, 250, 245, 0.35) 100%
      );
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.2s ease-in-out 0.2s;
    }

    .screen.is-visible .screen__overlay {
      opacity: 1;
    }

    .screen__cta {
      position: absolute;
      bottom: 8vh;
      left: 50%;
      transform: translateX(-50%) translateY(24px);
      opacity: 0;
      transition:
        opacity 0.9s ease-in-out 0.45s,
        transform 0.9s ease-in-out 0.45s;
      z-index: 2;
    }

    .screen.is-visible .screen__cta {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .screen__cta button {
      background: #C5EBDA;
      color: #1A1A1A;
      border: none;
      padding: 16px 48px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 6px 28px rgba(0, 0, 0, 0.12);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .screen__cta button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.16);
    }

    .screen__cta button:active {
      transform: translateY(0);
    }

    .progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      width: 0%;
      background: linear-gradient(90deg, #C5EBDA, #FAC200);
      z-index: 100;
      transition: width 0.1s linear;
    }

    .nav-dots {
      position: fixed;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 100;
    }

    .nav-dots button {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 2px solid rgba(26, 26, 26, 0.35);
      background: transparent;
      cursor: pointer;
      padding: 0;
      transition: background 0.3s ease, transform 0.3s ease, border-color 0.3s ease;
    }

    .nav-dots button.is-active {
      background: #1A1A1A;
      border-color: #1A1A1A;
      transform: scale(1.25);
    }

    @media (max-width: 640px) {
      .nav-dots {
        right: 12px;
        gap: 10px;
      }

      .nav-dots button {
        width: 8px;
        height: 8px;
      }

      .screen__cta {
        bottom: 6vh;
        width: calc(100% - 48px);
        text-align: center;
      }

      .screen__cta button {
        width: 100%;
        max-width: 280px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .screen__frame,
      .screen__overlay,
      .screen__cta,
      .nav-dots button {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div class="progress" id="progress" aria-hidden="true"></div>

  <nav class="nav-dots" aria-label="Screen navigation">
    <button type="button" data-target="screen-1" class="is-active" aria-label="Go to screen 1"></button>
    <button type="button" data-target="screen-2" aria-label="Go to screen 2"></button>
    <button type="button" data-target="screen-3" aria-label="Go to screen 3"></button>
    <button type="button" data-target="screen-4" aria-label="Go to screen 4"></button>
  </nav>

  <main class="landing" id="landing">
    <section class="screen" id="screen-1" data-index="0">
      <div class="screen__frame">
        <img class="screen__image" src="screen1.svg" alt="Smell Coffee hero screen" />
      </div>
      <div class="screen__overlay" aria-hidden="true"></div>
    </section>

    <section class="screen" id="screen-2" data-index="1">
      <div class="screen__frame">
        <img class="screen__image" src="screen2.svg" alt="Coffee cherries screen" />
      </div>
      <div class="screen__overlay" aria-hidden="true"></div>
    </section>

    <section class="screen" id="screen-3" data-index="2">
      <div class="screen__frame">
        <img class="screen__image" src="screen3.svg" alt="Pour over coffee screen" />
      </div>
      <div class="screen__overlay" aria-hidden="true"></div>
    </section>

    <section class="screen" id="screen-4" data-index="3">
      <div class="screen__frame">
        <img class="screen__image" src="screen4.svg" alt="Coffee products screen" />
      </div>
      <div class="screen__overlay" aria-hidden="true"></div>
      <div class="screen__cta">
        <button type="button" id="shop-btn">Shop Now</button>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const landing = document.getElementById('landing');
      const screens = Array.from(document.querySelectorAll('.screen'));
      const frames = Array.from(document.querySelectorAll('.screen__frame'));
      const dots = Array.from(document.querySelectorAll('.nav-dots button'));
      const progress = document.getElementById('progress');
      const shopBtn = document.getElementById('shop-btn');

      const STAGGER_MS = 150;

      function revealScreen(screen) {
        if (screen.classList.contains('is-visible')) return;

        screen.classList.add('is-visible');

        const frame = screen.querySelector('.screen__frame');
        const index = Number(screen.dataset.index || 0);
        frame.style.transitionDelay = index === 0 ? '0ms' : '0ms';
        frame.classList.add('is-visible');
      }

      const observer = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (!entry.isIntersecting) return;
            revealScreen(entry.target);
          });
        },
        {
          root: landing,
          threshold: 0.45,
          rootMargin: '0px',
        }
      );

      screens.forEach((screen) => observer.observe(screen));

      if (screens[0]) {
        revealScreen(screens[0]);
      }

      function updateProgress() {
        const scrollTop = landing.scrollTop;
        const maxScroll = landing.scrollHeight - landing.clientHeight;
        const pct = maxScroll > 0 ? (scrollTop / maxScroll) * 100 : 0;
        progress.style.width = pct + '%';
      }

      function updateActiveDot() {
        const midpoint = landing.scrollTop + landing.clientHeight * 0.5;

        let activeIndex = 0;
        screens.forEach((screen, i) => {
          const top = screen.offsetTop;
          const bottom = top + screen.offsetHeight;
          if (midpoint >= top && midpoint < bottom) {
            activeIndex = i;
          }
        });

        dots.forEach((dot, i) => {
          dot.classList.toggle('is-active', i === activeIndex);
        });
      }

      let ticking = false;
      landing.addEventListener('scroll', () => {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(() => {
          updateProgress();
          updateActiveDot();
          ticking = false;
        });
      }, { passive: true });

      dots.forEach((dot) => {
        dot.addEventListener('click', () => {
          const target = document.getElementById(dot.dataset.target);
          if (target) {
            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        });
      });

      shopBtn.addEventListener('click', () => {
        window.location.href = '/products';
      });

      updateProgress();
      updateActiveDot();
    })();
  </script>
</body>
</html>
